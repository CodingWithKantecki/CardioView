# Render blueprint: the public CardioView web app, always on. Every viewer connects their own Polar
# H10 in the browser (Web Bluetooth) and gets their own pipeline; the demo plays the normal rhythm.
# Dashboard: Blueprints, New Blueprint Instance, pick this repo. Every push to main redeploys.
services:
  - type: web
    name: cardioview
    runtime: python
    plan: starter            # the free plan sleeps after 15 idle minutes; a demo link must not
    region: virginia         # closest to Orlando
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CARDIOVIEW_BASE_URL    # links and QR codes are built on this
        value: https://cardioview.onrender.com
