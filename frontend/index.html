<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioView</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header class="top">
  <div class="brand">CardioView</div>
  <div class="status">
    <span class="state" id="pill" data-source="none" data-state="connecting"><span class="state-dot"></span><span id="pill-text">Connecting</span></span>
    <span class="device" id="conn"></span>
  </div>
</header>

<main class="screen">
  <section class="stage" aria-label="Heart">
    <div class="floor" id="floor" aria-hidden="true"><span class="ring"></span><span class="ring ring-2"></span><span class="ripple" id="ripple"></span></div>
    <div id="heart-view"></div>
    <p id="heart-missing" class="missing" hidden>Heart model not installed, see the README</p>
    <svg id="leaders" class="leaders" aria-hidden="true"></svg>
    <div class="label side-left" data-chamber="ra" hidden><b>RA</b><span>right atrium</span><canvas class="spark" data-spark="ra"></canvas></div>
    <div class="label side-right" data-chamber="la" hidden><b>LA</b><span>left atrium</span><canvas class="spark" data-spark="la"></canvas></div>
    <div class="label side-left" data-chamber="rv" hidden><b>RV</b><span>right ventricle</span><canvas class="spark" data-spark="rv"></canvas></div>
    <div class="label side-right" data-chamber="lv" hidden><b>LV</b><span>left ventricle</span><canvas class="spark" data-spark="lv"></canvas></div>
    <div class="controls" role="group" aria-label="View">
      <button type="button" data-action="rotate" aria-pressed="false">Rotate</button>
      <button type="button" data-action="wireframe" aria-pressed="false">Wireframe</button>
      <button type="button" data-action="opacity" aria-pressed="false">Opacity</button>
      <button type="button" data-action="cutaway" aria-pressed="false">Cutaway</button>
    </div>
    <div class="footnote"><span>Anatomy: 3D model</span><span>Chamber waves: modeled</span></div>
  </section>

  <aside class="column" id="column">
    <section class="instrument rate">
      <h2>Heart rate</h2>
      <div class="readout"><span class="bpm" id="bpm">--</span><span class="unit">bpm</span></div>
      <p class="rr" id="rr">-- s between beats</p>
    </section>
    <section class="instrument ecg">
      <h2>ECG <small>measured at 130 Hz</small></h2>
      <canvas id="trace"></canvas>
    </section>
    <section class="instrument chambers">
      <h2>Chambers <small>timing derived from the ECG</small></h2>
      <canvas id="lanes"></canvas>
    </section>
    <div class="extras" aria-hidden="true"></div>
    <div class="nowline" id="nowline" aria-hidden="true"><span>now</span></div>
  </aside>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
