<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioView</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header class="top">
  <div class="brand">CardioView</div>
  <span class="device" id="conn"></span>
  <span class="toggle source-toggle" id="source-mode"><button type="button" data-source="live" aria-pressed="false">Strap</button><button type="button" data-source="demo" aria-pressed="false">Demo</button></span>
</header>

<main class="screen">
  <section class="stage" aria-label="Heart">
    <div id="heart-view"></div>
    <canvas id="glitch" class="glitch" aria-hidden="true"></canvas>
    <p id="heart-missing" class="missing" hidden>Heart model not installed, see the README</p>
    <svg id="leaders" class="leaders" aria-hidden="true"></svg>
    <div class="label side-left" data-chamber="ra" hidden><b>RA</b><span>right atrium</span><canvas class="spark" data-spark="ra"></canvas></div>
    <div class="label side-right" data-chamber="la" hidden><b>LA</b><span>left atrium</span><canvas class="spark" data-spark="la"></canvas></div>
    <div class="label side-left" data-chamber="rv" hidden><b>RV</b><span>right ventricle</span><canvas class="spark" data-spark="rv"></canvas></div>
    <div class="label side-right" data-chamber="lv" hidden><b>LV</b><span>left ventricle</span><canvas class="spark" data-spark="lv"></canvas></div>
    <div class="alert" id="alert" hidden><b id="alert-title"></b><span id="alert-hint"></span></div>
    <label class="opacity"><span>Opacity</span><input id="opacity" type="range" min="15" max="100" value="100" aria-label="Heart opacity"></label>
    <div class="chat" id="chat">
      <span class="toggle chat-toggle"><button type="button" id="chat-open" aria-expanded="false" aria-controls="chat-box">Ask</button></span>
      <section class="chat-box" id="chat-box" hidden aria-label="Ask about the data">
        <header><span class="kicker">Ask about the data</span><button type="button" id="chat-close" aria-label="Close the chat">Close</button></header>
        <div class="chat-log" id="chat-log" aria-live="polite"></div>
        <form class="chat-form" id="chat-form"><input id="chat-input" type="text" maxlength="500" placeholder="Why is the rate changing?" autocomplete="off" aria-label="Your question"><button type="submit">Send</button></form>
        <p class="chat-note">Answers come from an AI and can be wrong</p>
      </section>
    </div>
    <span class="toggle view-tray" id="view-tray" aria-label="Heart view">
      <button type="button" data-view="rotate" aria-pressed="false" title="Auto-rotate (R)">Rotate</button>
      <button type="button" data-view="wire" aria-pressed="false" title="Wireframe (W)">Wire</button>
      <button type="button" data-view="cut" aria-pressed="false" title="Cutaway (C)">Cut</button>
      <button type="button" data-view="reset" title="Reset view (0)">Reset</button>
    </span>
  </section>

  <aside class="column" id="column">
    <section class="instrument rate">
      <h2>Heart rate</h2>
      <span class="kicker rhythm-kicker" id="rhythm-kicker" hidden>Simulated rhythm</span>
      <div class="readout-block">
        <div class="readout"><span class="bpm" id="bpm">--</span><span class="unit">bpm</span></div>
        <p class="rr" id="rr">-- s between beats</p>
      </div>
      <div class="toggle rhythm-tray" id="rhythms" hidden>
        <button type="button" data-rhythm="recording" aria-pressed="false">Recording</button>
        <button type="button" data-rhythm="sinus" aria-pressed="false">Sinus</button>
        <button type="button" data-rhythm="tachy" aria-pressed="false">Tachy</button>
        <button type="button" data-rhythm="brady" aria-pressed="false">Brady</button>
        <button type="button" data-rhythm="afib" aria-pressed="false">A-fib</button>
        <button type="button" data-rhythm="pvc" aria-pressed="false">PVC</button>
        <button type="button" data-rhythm="vt" aria-pressed="false">V-tach</button>
      </div>
    </section>
    <section class="instrument ecg">
      <h2>ECG
        <span class="toggle" id="ecg-mode"><button type="button" data-mode="2d" aria-pressed="true">2D</button><button type="button" data-mode="3d" aria-pressed="false">3D</button></span></h2>
      <canvas id="trace"></canvas>
    </section>
    <section class="instrument chambers">
      <h2>Chambers <small>timing derived from the ECG</small></h2>
      <canvas id="lanes"></canvas>
    </section>
    <div class="nowline" id="nowline-ecg" aria-hidden="true"></div>
    <div class="nowline" id="nowline-lanes" aria-hidden="true"></div>
  </aside>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
