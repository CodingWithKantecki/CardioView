<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardioView</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="session.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header class="top">
  <div class="brand" id="brand" title="Full screen on or off"><img class="brand-mark" src="assets/logo-mark.png" alt="">CardioView</div>
  <div class="toggle timeline" id="transport">
    <button type="button" data-mode="rewind" aria-label="Rewind" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1L0 6l6 5zM12 1L6 6l6 5z"/></svg></button>
    <button type="button" data-mode="play" aria-label="Play" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1v10l9-5z"/></svg></button>
    <button type="button" data-mode="paused" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg></button>
    <button type="button" data-mode="forward" aria-label="Fast forward" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 1l6 5-6 5zM6 1l6 5-6 5z"/></svg></button>
    <button type="button" data-mode="live" aria-pressed="true">Live</button>
    <canvas id="timeline-strip" aria-label="The last 30 seconds of ECG, drag to scrub"></canvas>
    <span class="export-item"><button type="button" id="export" aria-expanded="false" aria-controls="export-menu">Export</button>
      <div class="export-menu" id="export-menu" hidden>
        <button type="button" data-format="pdf">PDF report</button>
        <button type="button" data-format="fhir">FHIR</button>
        <button type="button" data-format="csv">CSV</button>
      </div></span>
  </div>
  <span class="toggle source-toggle" id="source-mode"><button type="button" data-source="live" aria-pressed="false">Strap</button><button type="button" data-source="demo" aria-pressed="false">Demo</button><button type="button" data-source="exercise" aria-pressed="false" aria-disabled="true">Exercise</button></span>
</header>

<main class="screen">
  <section class="stage" aria-label="Heart">
    <div class="session-ring" id="session-ring" hidden aria-hidden="true"></div>
    <div id="heart-view"></div>
    <canvas id="glitch" class="glitch" aria-hidden="true"></canvas>
    <p id="heart-missing" class="missing" hidden>Heart model not installed, see the README</p>
    <svg id="leaders" class="leaders" aria-hidden="true"></svg>
    <div class="label side-left" data-chamber="ra" hidden><b>Right atrium</b><canvas class="spark" data-spark="ra"></canvas></div>
    <div class="label side-right" data-chamber="la" hidden><b>Left atrium</b><canvas class="spark" data-spark="la"></canvas></div>
    <div class="label side-left" data-chamber="rv" hidden><b>Right ventricle</b><canvas class="spark" data-spark="rv"></canvas></div>
    <div class="label side-right" data-chamber="lv" hidden><b>Left ventricle</b><canvas class="spark" data-spark="lv"></canvas></div>
    <div class="alert" id="alert" hidden><b id="alert-title"></b><span id="alert-hint"></span></div>
    <div class="chat" id="chat">
      <span class="toggle chat-toggle"><button type="button" id="chat-open" aria-expanded="false" aria-controls="chat-box">Ask</button></span>
      <section class="chat-box" id="chat-box" hidden aria-label="Ask about the data">
        <header><span class="kicker">Ask about the data</span><button type="button" id="chat-close" aria-label="Close the chat">Close</button></header>
        <div class="chat-log" id="chat-log" aria-live="polite"></div>
        <form class="chat-form" id="chat-form"><input id="chat-input" type="text" maxlength="500" placeholder="Why is the rate changing?" autocomplete="off" aria-label="Your question"><button type="submit">Send</button></form>
        <p class="chat-note">Answers come from an AI and can be wrong</p>
      </section>
    </div>
    <div class="session" id="session" hidden aria-live="polite"><p class="session-prompt" id="session-prompt"></p><p class="session-sub" id="session-sub"></p></div>
    <nav class="dock" id="dock" aria-label="Heart view controls">
      <span class="dock-item"><button type="button" data-action="rotate" data-label="Rotate" aria-pressed="false" aria-label="Rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></span>
      <span class="dock-item"><button type="button" data-action="wireframe" data-label="Wireframe" aria-pressed="false" aria-label="Wireframe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5M4 16.5l8-4.5 8 4.5"/></svg></button></span>
      <span class="dock-item"><button type="button" data-action="open" data-label="Open" aria-pressed="false" aria-label="Open the heart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 7.4V20"/><path d="M9 11h3M12 14h3"/></svg></button></span>
      <span class="dock-item has-pop"><button type="button" data-action="opacity" data-label="Opacity" aria-label="Opacity"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button><div class="opacity-pop"><span>Opacity</span><input id="opacity" type="range" min="15" max="100" value="100" aria-label="Heart opacity"></div></span>
      <span class="dock-item"><button type="button" data-action="reset" data-label="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button></span>
    </nav>
  </section>

  <aside class="column" id="column">
    <section class="instrument rate">
      <h2>Heart rate</h2>
      <span class="status-line" id="conn"></span>
      <div class="readout-block">
        <div class="readout"><span class="bpm" id="bpm">--</span><span class="unit">bpm</span></div>
      </div>
      <div class="rhythm-block" id="rhythms" hidden>
        <div class="toggle rhythm-tray" id="rhythm-tray">
        <button type="button" data-rhythm="sinus" aria-pressed="false">Normal</button>
        <button type="button" data-rhythm="mi" aria-pressed="false">Heart attack</button>
          <button type="button" class="gemini-cell" data-rhythm="gemini" aria-pressed="false"><span class="gemini-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg></span><span class="gemini-text">Gemini heart</span></button>
        </div>
        <section class="gemini" id="gemini" hidden aria-label="Gemini heart">
          <div class="gemini-head">
            <span class="gemini-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg></span>
            <span class="gemini-title">Gemini heart</span>
            <span class="gemini-powered">Powered by Gemini</span>
            <button type="button" class="gemini-back" id="gemini-back">Back</button>
          </div>
          <form class="describe" id="describe">
            <input id="describe-text" type="text" maxlength="300" autocomplete="off" placeholder="A 40 year old on cocaine, a runner asleep, atrial fibrillation" aria-label="Describe a patient, a situation or a heart rhythm">
            <button type="submit" id="describe-go"><span class="gemini-mark small" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg></span>Simulate</button>
          </form>
          <p class="describe-note" id="describe-note" hidden></p>
          <span class="gemini-stars" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg></span>
        </section>
      </div>
      <div class="exercise-panel" id="strap-panel" hidden>
        <p class="exercise-note" id="strap-note"></p>
        <span class="toggle exercise-tray" id="strap-tray">
          <button type="button" id="strap-connect">Connect Polar H10</button>
          <button type="button" id="strap-disconnect" hidden>Disconnect</button>
        </span>
      </div>
      <div class="exercise-panel" id="exercise" hidden>
        <p class="exercise-note" id="exercise-note"></p>
        <span class="toggle exercise-tray">
          <button type="button" id="exercise-start" aria-disabled="true">Start</button>
          <button type="button" id="exercise-stop" hidden>Stop</button>
          <button type="button" id="exercise-voice" aria-pressed="true">Voice</button>
        </span>
      </div>
    </section>
    <section class="instrument ecg">
      <h2>ECG</h2>
      <canvas id="trace"></canvas>
    </section>
    <section class="instrument chambers">
      <h2>Chambers</h2>
      <canvas id="lanes"></canvas>
    </section>
    <div class="nowline" id="nowline-ecg" aria-hidden="true"></div>
    <div class="nowline" id="nowline-lanes" aria-hidden="true"></div>
  </aside>
</main>
<div class="report" id="report" hidden><iframe id="report-frame" title="Session summary"></iframe></div>
<script type="module" src="main.js"></script>
</body>
</html>
