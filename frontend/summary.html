<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your heart, CardioView</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/summary.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="brand-mark" src="/assets/logo-mark.png" alt="">CardioView</div>
  <span class="meta" id="meta"></span>
  <button type="button" class="back" id="back" hidden>Back to live</button>
</header>

<main class="sheet" id="sheet" hidden>
  <section class="band">
    <div class="box rate" id="rate">
      <h2>Heart rate over time</h2>
      <canvas class="chart" id="rate-chart"></canvas>
      <p class="text small" id="rate-text"></p>
    </div>
    <div class="box numbers">
      <h2>Numbers</h2>
      <dl class="stats" id="stats"></dl>
    </div>
    <div class="box beat" id="beat">
      <h2>Average heartbeat</h2>
      <canvas class="chart" id="beat-chart"></canvas>
      <p class="text small" id="beat-text"></p>
    </div>
    <aside class="box take" id="take" hidden>
      <img id="qr" alt="QR code that opens this report">
      <p id="qr-text">Scan to keep this on your phone</p>
      <p class="dim small" id="until"></p>
    </aside>
  </section>
  <section class="strips-box">
    <h2>ECG <span class="sub" id="strips-sub"></span></h2>
    <div class="paper" id="strips"></div>
    <p class="text dim" id="strips-note" hidden>The ECG itself stays on the server that recorded it. Open this report there to see the strips.</p>
  </section>
  <footer class="foot">
    <p>A visualization, not a medical device. It does not diagnose anything.</p>
    <button type="button" id="delete" hidden>Delete my session</button>
  </footer>
</main>
<p class="gone" id="gone" hidden></p>
<script type="module" src="/summary.js"></script>
</body>
</html>
